[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mecsl"
version = "0.1.0"
description = "Macro-Enabled Configuration and Scripting Language — a compiler pipeline DSL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Manan Oswal",      email = "manan@example.com" },
    { name = "Siddhant Kumbhar", email = "siddhant@example.com" },
    { name = "Pranav Landge",    email = "pranav@example.com" },
]

[project.scripts]
mecsl = "mecsl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
